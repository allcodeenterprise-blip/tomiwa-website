
<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b12;
            color: #f0f0f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: rgba(18, 18, 32, 0.92);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            text-align: center;
            border: 1px solid rgba(224, 158, 54, 0.15);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }
        .badge {
            display: inline-block;
            background: rgba(224, 158, 54, 0.06);
            border: 1px solid rgba(224, 158, 54, 0.1);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.65rem;
            color: #E09E36;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .business-name {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #E09E36, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }
        .tagline {
            font-size: 0.85rem;
            color: #C0C0C0;
            margin-bottom: 1.5rem;
        }
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(192,192,192,0.04);
            color: #C0C0C0;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .contact-item:hover { color: #E09E36; }
        .btn-whatsapp {
            display: inline-block;
            background: #25D366;
            color: #fff;
            padding: 0.9rem 2.5rem;
            border-radius: 40px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 1.5rem;
            width: 100%;
        }
        .btn-whatsapp:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(37,211,102,0.3); }
        .footer {
            margin-top: 1.8rem;
            font-size: 0.65rem;
            color: #404058;
            border-top: 1px solid rgba(192,192,192,0.04);
            padding-top: 1.5rem;
        }

</head>
<body>

</body>
