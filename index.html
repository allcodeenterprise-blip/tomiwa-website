<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TOMIWA PLANK & PROPERTIES - Premium Planks and Real Estate" />
  <title>TOMIWA PLANK & PROPERTIES</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0b0b12;
      color: #f0f0f8;
      line-height: 1.6;
    }

    /* ============================================================
       ACE 3-CODE COLOR SYSTEM
    ============================================================ */
    .code-art {
      color: #E09E36;
    }
    .code-abt {
      color: #3603E0;
    }
    .code-con {
      color: #008080;
    }

    .bg-art {
      background: #E09E36;
    }
    .bg-abt {
      background: #3603E0;
    }
    .bg-con {
      background: #008080;
    }

    .border-art {
      border-color: #E09E36;
    }
    .border-abt {
      border-color: #3603E0;
    }
    .border-con {
      border-color: #008080;
    }

    /* ============================================================
       NAVIGATION
    ============================================================ */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(11, 11, 18, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(224, 158, 54, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .nav-brand span {
      background: linear-gradient(135deg, #E09E36 0%, #FFD700 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: #C0C0C0;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: #E09E36;
      transition: width 0.3s;
    }

    .nav-links a:hover {
      color: #FFFFFF;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0.5rem;
    }

    .hamburger span {
      width: 28px;
      height: 2px;
      background: #C0C0C0;
      transition: all 0.3s;
    }

    /* ============================================================
       HERO SECTION
    ============================================================ */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
      background: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0b0b12 80%);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(224, 158, 54, 0.06) 0%, transparent 60%);
      animation: heroGlow 20s ease-in-out infinite;
    }

    @keyframes heroGlow {
      0%,
      100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(10%, 10%);
      }
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 900px;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(224, 158, 54, 0.12);
      color: #E09E36;
      padding: 0.4rem 1.5rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      border: 1px solid rgba(224, 158, 54, 0.2);
      margin-bottom: 1.5rem;
      animation: fadeInDown 0.8s ease;
    }

    .hero h1 {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.8s ease 0.2s both;
    }

    .hero h1 .highlight {
      background: linear-gradient(135deg, #E09E36 0%, #FFD700 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.3rem;
      color: #C0C0C0;
      max-width: 600px;
      margin: 0 auto 2.5rem;
      animation: fadeInUp 0.8s ease 0.4s both;
    }

    .hero-codes {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      animation: fadeInUp 0.8s ease 0.6s both;
    }

    .hero-code-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      padding: 0.8rem 1.8rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(192, 192, 192, 0.06);
      transition: all 0.3s;
    }

    .hero-code-item:hover {
      transform: translateY(-5px);
      border-color: rgba(224, 158, 54, 0.2);
      background: rgba(224, 158, 54, 0.05);
    }

    .hero-code-item .code {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: monospace;
    }

    .hero-code-item .label {
      font-size: 0.75rem;
      color: #9090a8;
      letter-spacing: 0.05em;
    }

    /* ============================================================
       SECTION STYLES
    ============================================================ */
    section {
      padding: 5rem 2rem;
    }

    .section-title {
      font-size: 2.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.8rem;
    }

    .section-subtitle {
      text-align: center;
      color: #9090a8;
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto 3rem;
    }

    /* ============================================================
       ART SECTION — Gallery
    ============================================================ */
    #showcase {
      background: #0f0f1a;
    }

    .masonry-grid {
      column-count: 4;
      column-gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      border-radius: 1.5rem;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 2px solid transparent;
    }

    .masonry-item:hover {
      transform: scale(1.02);
      border-color: #E09E36;
      z-index: 10;
    }

    .masonry-item img {
      width: 100%;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .masonry-item:hover img {
      transform: scale(1.05);
    }

    .masonry-item .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11, 11, 18, 0.8) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
      display: flex;
      align-items: flex-end;
      padding: 1.5rem;
    }

    .masonry-item:hover .overlay {
      opacity: 1;
    }

    .masonry-item .overlay span {
      color: white;
      font-weight: 600;
      font-size: 1rem;
    }

    .masonry-item:nth-child(1) img {
      min-height: 400px;
      object-fit: cover;
    }
    .masonry-item:nth-child(2) img {
      min-height: 500px;
      object-fit: cover;
    }
    .masonry-item:nth-child(3) img {
      min-height: 350px;
      object-fit: cover;
    }
    .masonry-item:nth-child(4) img {
      min-height: 450px;
      object-fit: cover;
    }
    .masonry-item:nth-child(5) img {
      min-height: 380px;
      object-fit: cover;
    }
    .masonry-item:nth-child(6) img {
      min-height: 420px;
      object-fit: cover;
    }

    /* ============================================================
       LIGHTBOX
    ============================================================ */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      justify-content: center;
      align-items: center;
      padding: 2rem;
      animation: fadeIn 0.3s ease;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 1rem;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      animation: zoomIn 0.4s ease;
    }

    .lightbox-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-close:hover {
      background: rgba(224, 158, 54, 0.2);
      border-color: #E09E36;
      transform: rotate(90deg);
    }

    /* ============================================================
       ABT SECTION — About
    ============================================================ */
    #about {
      background: #0b0b12;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      max-width: 1200px;
      margin: 0 auto;
      align-items: start;
    }

    .about-image {
      border-radius: 1.5rem;
      overflow: hidden;
      border: 2px solid rgba(224, 158, 54, 0.15);
      position: relative;
    }

    .about-image img {
      width: 100%;
      display: block;
      min-height: 400px;
      object-fit: cover;
      background: linear-gradient(135deg, #1a1a2e, #0b0b12);
    }

    .about-image .badge {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      background: rgba(224, 158, 54, 0.15);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      border: 1px solid rgba(224, 158, 54, 0.2);
      color: #E09E36;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .about-content h3 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .about-content .title {
      color: #E09E36;
      font-weight: 600;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .about-content p {
      color: #C0C0C0;
      margin-bottom: 1.2rem;
      line-height: 1.8;
    }

    .about-content .quote {
      background: rgba(224, 158, 54, 0.05);
      border-left: 4px solid #E09E36;
      padding: 1.5rem 2rem;
      border-radius: 0 1rem 1rem 0;
      margin: 1.5rem 0;
    }

    .about-content .quote p {
      font-style: italic;
      font-size: 1.1rem;
      color: #E09E36;
      margin-bottom: 0;
    }

    .about-content .quote .author {
      font-style: normal;
      color: #C0C0C0;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin: 1.5rem 0;
    }

    .skill-tag {
      background: rgba(255, 255, 255, 0.03);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      border: 1px solid rgba(192, 192, 192, 0.06);
      font-size: 0.85rem;
      color: #C0C0C0;
    }

    .skill-tag:hover {
      border-color: #3603E0;
      color: #3603E0;
    }

    .client-logos {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(192, 192, 192, 0.06);
    }

    .client-logo {
      background: rgba(255, 255, 255, 0.02);
      padding: 0.5rem 1.5rem;
      border-radius: 0.8rem;
      border: 1px solid rgba(192, 192, 192, 0.04);
      font-weight: 600;
      color: #9090a8;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .client-logo:hover {
      border-color: #E09E36;
      color: #E09E36;
    }

    /* ============================================================
       CON SECTION — Contact
    ============================================================ */
    #contact {
      background: #0f0f1a;
    }

    .contact-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .contact-info h3 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .contact-info .sub {
      color: #9090a8;
      margin-bottom: 2rem;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1.2rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 1rem;
      border: 1px solid rgba(192, 192, 192, 0.04);
      transition: all 0.3s;
    }

    .contact-item:hover {
      border-color: rgba(0, 128, 128, 0.2);
      background: rgba(0, 128, 128, 0.04);
    }

    .contact-item .icon {
      font-size: 1.5rem;
      width: 40px;
      text-align: center;
    }

    .contact-item .info {
      color: #C0C0C0;
    }

    .contact-item .info strong {
      color: white;
      font-weight: 600;
    }

    .contact-item .info a {
      color: #008080;
      text-decoration: none;
      transition: color 0.3s;
    }

    .contact-item .info a:hover {
      color: #E09E36;
    }

    .whatsapp-btn {
      display: inline-block;
      background: #25D366;
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 40px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s;
      margin-top: 0.5rem;
    }

    .whatsapp-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3);
    }

    /* Contact Form */
    .contact-form {
      background: rgba(255, 255, 255, 0.02);
      padding: 2.5rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(192, 192, 192, 0.06);
    }

    .contact-form h4 {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      color: #C0C0C0;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      color: #9090a8;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(192, 192, 192, 0.06);
      border-radius: 0.8rem;
      color: white;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #008080;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group select option {
      background: #0b0b12;
      color: white;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .captcha-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 0.8rem;
      border: 1px solid rgba(192, 192, 192, 0.04);
      font-size: 0.9rem;
    }

    .captcha-wrap .math {
      font-weight: 700;
      font-size: 1.1rem;
      color: #E09E36;
    }

    .captcha-wrap input {
      width: 80px;
      background: transparent;
      border: 1px solid rgba(192, 192, 192, 0.1);
      padding: 0.4rem;
      border-radius: 0.4rem;
      color: white;
      text-align: center;
    }

    .submit-btn {
      background: #008080;
      color: white;
      padding: 0.9rem 2.5rem;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }

    .submit-btn:hover {
      background: #E09E36;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(224, 158, 54, 0.3);
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    .footer {
      background: #08080e;
      padding: 2.5rem 2rem;
      text-align: center;
      border-top: 1px solid rgba(224, 158, 54, 0.06);
    }

    .footer .codes {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .footer .code-badge {
      font-weight: 600;
      font-family: monospace;
      font-size: 0.9rem;
    }

    .footer p {
      color: #606078;
      font-size: 0.85rem;
    }

    .footer p a {
      color: #E09E36;
      text-decoration: none;
    }

    /* ============================================================
       ANIMATIONS
    ============================================================ */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 1200px) {
      .masonry-grid {
        column-count: 3;
      }
    }

    @media (max-width: 992px) {
      .about-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .contact-wrapper {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .hero h1 {
        font-size: 3.2rem;
      }
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        gap: 1rem;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(11, 11, 18, 0.98);
        padding: 2rem;
        border-bottom: 1px solid rgba(224, 158, 54, 0.1);
      }

      .nav-links.active {
        display: flex;
      }

      .hamburger {
        display: flex;
      }

      .hero h1 {
        font-size: 2.5rem;
      }

      .hero p {
        font-size: 1rem;
      }

      .masonry-grid {
        column-count: 2;
      }

      section {
        padding: 3rem 1rem;
      }

      .section-title {
        font-size: 2rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .contact-form {
        padding: 1.5rem;
      }

      .hero-codes {
        gap: 0.8rem;
      }

      .hero-code-item {
        padding: 0.5rem 1.2rem;
      }

      .hero-code-item .code {
        font-size: 1.2rem;
      }
    }

    @media (max-width: 480px) {
      .masonry-grid {
        column-count: 1;
      }

      .navbar {
        padding: 0.8
